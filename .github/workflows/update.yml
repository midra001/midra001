name: Update readme

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt

      - name: Render original-style terminal
        run: python main.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIFOS_GENERAL_FPS: '13'
          GIFOS_GENERAL_LOOP_COUNT: '0'
          GIFOS_GENERAL_COLOR_SCHEME: everblush
          GIFOS_GENERAL_USER_NAME: midra001

      - name: Commit updated README
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add README.md output.gif preview.png

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m 'Update terminal README'

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"

            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort
              echo "::error::Rebase conflict. Resolve the conflicting changes before rerunning."
              exit 1
            fi

            if git push origin HEAD:main; then
              exit 0
            fi

            sleep 3
          done

          echo "::error::Push failed after 3 attempts. Check concurrent updates, branch protection, and permissions."
          exit 1
